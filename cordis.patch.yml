# dsh-think-window bundle patch
#
# Inserts the plugin row into the web profile roster. The row runs the host
# half (exports ".") in the host process and the browser half (exports
# "./client") in the web GUI.
#
# The row carries no config: the window height default and its range live in
# the host schema, and the Plugins page row configuration is where it is
# edited. A later patch layer overrides it by id:
#
#   - id: dsh-think-window
#     config:
#       lines: 10
- insert:
    - id: dsh-think-window
      name: 'dsh-think-window'
